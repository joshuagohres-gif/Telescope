name: Update Satellite TLEs

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-tles:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd worker
          pip install -r requirements.txt
      
      - name: Fetch TLEs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd worker
          python -c "
import asyncio
from main import fetch_satellite_tles
asyncio.run(fetch_satellite_tles())
          "
      
      - name: Import TLEs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd worker
          python importer.py
      
      - name: Cleanup
        run: |
          echo "TLE update completed at $(date)"
